// Fleet port to Minecraft 26.1.2 / NeoForge (2026-10-09): NeoGradle -> ModDevGradle, Java 25, Kotlin 2.4.0 /
// Kotlin for Forge 6.3.0, our AE2 26.1 fork from mavenLocal. Original build files are kept in .fleet-orig/.
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'org.jetbrains.kotlin.jvm' version '2.4.0'
}

group = 'dev.lasm.betterp2p'
version = '1.5.2+26.1.2'
base.archivesName = project.name

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}
kotlin.compilerOptions.jvmTarget = JvmTarget.JVM_25

repositories {
    mavenLocal()
    maven {
        name = "Kotlin for Forge"
        url = "https://thedarkcolour.github.io/KotlinForForge/"
        content { includeGroup "thedarkcolour" }
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

neoForge {
    version = project.neo_version
    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            jvmArgument '-Xmx2g'
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        clientData {
            clientData()
            programArguments.addAll '--mod', project.name, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
    mods {
        "${project.name}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.4.0'
    implementation "thedarkcolour:kotlinforforge-neoforge:${kff_version}"
    runtimeOnly "dev.emi:emi-neoforge:${emi_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : project.name,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : project.version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
        ae2_version            : ae2_version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

